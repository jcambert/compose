name: Apply Local UI Rendering Fix

on:
  push:
    branches:
      - fix/local-ui-rendering

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/local-ui-rendering
      - name: Apply local UI rendering fix
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          const uiPath = 'src/app/ui-server-service.ts';
          let ui = readFileSync(uiPath, 'utf8');
          const originalUi = ui;
          ui = ui.replace("<div id=\"root\"></div>", "<div id=\"root\"><main class=\"app-shell\"><div class=\"banner info\">Loading compose UI...</div></main></div>");
          ui = ui.replace(".join('\\n') || form.execution.command", ".join('\\\\n') || form.execution.command");
          if (ui === originalUi) {
            throw new Error('No local UI rendering replacement was applied.');
          }
          writeFileSync(uiPath, ui);

          const testPath = 'tests/unit/ui-server-service.test.ts';
          let test = readFileSync(testPath, 'utf8');
          const originalTest = test;
          test = test.replace(
            "      expect(html).toContain('window.__COMPOSE_UI_TOKEN__');",
            "      expect(html).toContain('window.__COMPOSE_UI_TOKEN__');\n      expect(html).toContain('Loading compose UI...');\n      expect(html).toContain(\".join('\\\\n')\");\n      expect(html).not.toContain(\".join('\\n')\");"
          );
          if (test === originalTest) {
            throw new Error('No local UI test replacement was applied.');
          }
          writeFileSync(testPath, test);
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ui-server-service.ts tests/unit/ui-server-service.test.ts
          git commit -m "fix: render local UI without invalid JavaScript"
          git push origin fix/local-ui-rendering
