name: Browser Live Status Typefix

on:
  push:
    branches:
      - feature/browser-live-status
    paths:
      - .github/workflows/browser-live-status-typefix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/browser-live-status
      - name: Fix ServiceAction type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/interactive/stack-browser.ts')
          content = path.read_text(encoding='utf-8')
          before = "type ServiceAction = 'up' | 'build' | 'stop' | 'restart' | 'logs' | 'shell' | 'refresh';"
          after = "type ServiceAction = 'up' | 'build' | 'stop' | 'restart' | 'logs' | 'shell';"
          if before not in content:
              raise SystemExit('Expected ServiceAction union was not found')
          path.write_text(content.replace(before, after), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/interactive/stack-browser.ts
          git commit -m "fix: separate service refresh from executable actions"
          git push
