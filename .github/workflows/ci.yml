name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke CLI
        run: npm run smoke

      - name: Package dry-run
        run: npm run pack:dry-run

  prepare-pr54:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 54
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/release-v0.3.0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - name: Consolidate release documentation
        run: node scripts/consolidate-v030-docs.mjs
      - name: Validate
        run: npm ci && npm run validate
      - name: Commit documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md README.md
          git rm scripts/consolidate-v030-docs.mjs
          git commit -m "docs: finalize v0.3.0 release documentation"
          git push
