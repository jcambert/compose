name: Diagnose Lint

on:
  push:
    branches:
      - perf/scanner-exclusions-large-dirs

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
