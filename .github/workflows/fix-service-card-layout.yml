name: Fix service card layout

on:
  push:
    branches:
      - fix/service-card-layout

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/service-card-layout
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - name: Apply layout fix
        run: python scripts/fix-service-card-layout.py
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run validate
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: correct service card layout"
          git push origin HEAD:fix/service-card-layout
