          if marker in text and entry.strip() not in text:
              text = text.replace(marker, marker + entry, 1)
          changelog.write_text(text)

          doc = Path('docs/local-ui-server.md')
          doc.write_text(doc.read_text() + r'''

          ## Guided Compose service editing

          The local UI exposes a dedicated **Services** view for the selected stack. It lists editable service definitions and provides guided forms for common fields such as image, build context, ports, environment variables, volumes, dependencies, command and restart policy.

          Every mutation follows the same safe sequence:

          1. load the current Compose document and its content hash;
          2. generate and validate a YAML mutation preview;
          3. display the unified diff and preserved advanced-key warnings;
          4. commit only after explicit user confirmation;
          5. reject the commit with HTTP `409` when the file changed after preview.

          Token-protected endpoints:

          - `GET /api/services?composeFilePath=...`
          - `POST /api/services/preview`
          - `POST /api/services/commit`
          ''')

