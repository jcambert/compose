name: Implement browser filtering and sorting

on:
  push:
    branches:
      - feat/browser-filtering-sorting

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/browser-filtering-sorting
      - name: Apply implementation
        run: node .github/scripts/implement-browser-filtering-sorting.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/backlog.md src/cli/interactive-stack-browser-command.ts src/interactive/stack-browser.ts tests/unit/stack-browser.test.ts
          git commit -m "feat: improve browser filtering and sorting"
          git push
