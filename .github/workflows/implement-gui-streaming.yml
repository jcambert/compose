          helpers = r'''

function readSseData<T>(event: Event): T | undefined {
  const data = (event as MessageEvent<string>).data;

  try {
    return JSON.parse(data) as T;
  } catch {
    return undefined;
  }
}

function appendLiveLogLine(setLogStream: React.Dispatch<React.SetStateAction<LogStreamState>>, line: string) {
  setLogStream((current) => ({
    ...current,
    lines: [...current.lines, line].slice(-300),
    error: undefined,
  }));
}

function appendLiveLogContent(
  setLogStream: React.Dispatch<React.SetStateAction<LogStreamState>>,
  stream: LogStreamEvent['stream'],
  content: string,
) {
  const lines = content
    .split(/\r?\n/)
    .map((line) => line.trimEnd())
    .filter((line) => line.length > 0)
    .map((line) => `[${stream}] ${line}`);

  if (lines.length === 0) {
    return;
  }

  setLogStream((current) => ({
    ...current,
    lines: [...current.lines, ...lines].slice(-300),
    error: undefined,
  }));
}
