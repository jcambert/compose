name: Implement GUI streaming

on:
  push:
    branches:
      - feature/gui-streaming

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'feat: add GUI logs and runtime streaming') }}
