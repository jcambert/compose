name: Issue 44 bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v5
        with:
          ref: agent/windows-real-stack-hardening
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - name: Apply issue 44 implementation
        run: python3 scripts/apply-issue-44.py
      - name: Remove bootstrap files
        run: rm scripts/apply-issue-44.py .github/workflows/issue-44-bootstrap.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate Linux and installed package
        run: |
          npm run validate
          npm run test:installed
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: harden Windows and real-stack editing"
          git push origin HEAD:agent/windows-real-stack-hardening
