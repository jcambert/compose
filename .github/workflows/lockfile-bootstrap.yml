name: Lockfile Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-lockfile:
    name: Generate package-lock.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Print package lock as base64
        shell: bash
        run: |
          echo 'PACKAGE_LOCK_JSON_BASE64_BEGIN'
          base64 -w0 package-lock.json
          echo
          echo 'PACKAGE_LOCK_JSON_BASE64_END'
