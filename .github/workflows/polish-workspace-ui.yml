name: Polish workspace UI

on:
  push:
    branches:
      - fix/polish-workspace-management-ui

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix: polish workspace management UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply workspace UI polish
        run: |
          python <<'PY'
          from pathlib import Path

          app_path = Path('src/ui/App.tsx')
          app = app_path.read_text()

          app = app.replace("""type WorkspaceFormState = {
  name: string;
  path: string;
  busy: boolean;
  message?: string;
  error?: string;
};""", """type WorkspaceFormState = {
  name: string;
  path: string;
  busy: boolean;
  editingName?: string;
  message?: string;
  error?: string;
};""")

          app = app.replace("""  const [workspaceForm, setWorkspaceForm] = useState<WorkspaceFormState>({ name: '', path: '', busy: false });
  const [form, setForm] = useState<CommandFormState>({""", """  const [workspaceForm, setWorkspaceForm] = useState<WorkspaceFormState>({ name: '', path: '', busy: false });
  const [workspaceRemovalName, setWorkspaceRemovalName] = useState<string | undefined>();
  const [form, setForm] = useState<CommandFormState>({""")

          start = app.index("  async function createWorkspaceFromUi()")
          end = app.index("  async function useWorkspaceFromUi", start)
          app = app[:start] + """  async function createWorkspaceFromUi() {
    const name = workspaceForm.name.trim();
    const path = workspaceForm.path.trim();
    const editingName = workspaceForm.editingName;

    if (name.length === 0 || path.length === 0) {
      setWorkspaceForm((current) => ({ ...current, error: 'Workspace name and path are required.', message: undefined }));
      return;
    }

    await runWorkspaceMutation(
      () => apiPost<WorkspaceListResult>(token, '/api/workspaces', { name, path }),
      editingName === undefined ? `Workspace ${name} was created.` : `Workspace ${name} was updated.`,
      true,
    );
  }

  function editWorkspaceFromUi(workspace: WorkspaceDefinition) {
    setWorkspaceRemovalName(undefined);
    setWorkspaceForm({
      name: workspace.name,
      path: workspace.path,
      busy: false,
      editingName: workspace.name,
      message: undefined,
      error: undefined,
    });
  }

  function cancelWorkspaceEdit() {
    setWorkspaceForm({ name: '', path: '', busy: false });
  }

""" + app[end:]

          start = app.index("  async function removeWorkspaceFromUi")
          end = app.index("\n\n  async function runWorkspaceMutation", start)
          app = app[:start] + """  async function removeWorkspaceFromUi(name: string) {
    setWorkspaceRemovalName(undefined);
    await runWorkspaceMutation(
      () => apiDelete<WorkspaceListResult>(token, `/api/workspaces/${encodeURIComponent(name)}`),
      `Workspace ${name} was removed.`,
      false,
    );
  }
""" + app[end:]

          start = app.index("  async function runWorkspaceMutation(")
          end = app.index("  async function preview()", start)
          app = app[:start] + """  async function runWorkspaceMutation(
    mutation: () => Promise<WorkspaceListResult>,
    successMessage: string,
    clearCreateForm: boolean,
  ) {
    setWorkspaceForm((current) => ({ ...current, busy: true, error: undefined, message: undefined }));

    try {
      const workspaces = await mutation();
      setState((current) => ({ ...current, workspaces }));
      setWorkspaceForm((current) => ({
        name: clearCreateForm ? '' : current.name,
        path: clearCreateForm ? '' : current.path,
        busy: false,
        ...(clearCreateForm ? {} : current.editingName === undefined ? {} : { editingName: current.editingName }),
        message: successMessage,
      }));
      setWorkspaceRemovalName(undefined);
      setSelectedId(undefined);
      clearCommandFeedback(setForm);
      await load();
    } catch (error) {
      setWorkspaceForm((current) => ({
        ...current,
        busy: false,
        error: error instanceof Error ? error.message : 'Unable to update workspace configuration.',
      }));
    }
  }

""" + app[end:]

          app = app.replace("""            onCreate={() => void createWorkspaceFromUi()}
            onUse={(name) => void useWorkspaceFromUi(name)}
            onRemove={(name) => void removeWorkspaceFromUi(name)}
            onOpenStacks={() => setActiveView('stacks')}""", """            workspaceRemovalName={workspaceRemovalName}
            onCreate={() => void createWorkspaceFromUi()}
            onUse={(name) => void useWorkspaceFromUi(name)}
            onEdit={editWorkspaceFromUi}
            onCancelEdit={cancelWorkspaceEdit}
            onAskRemove={setWorkspaceRemovalName}
            onCancelRemove={() => setWorkspaceRemovalName(undefined)}
            onRemove={(name) => void removeWorkspaceFromUi(name)}
            onOpenStacks={() => setActiveView('stacks')}""")

          start = app.index("function WorkspacesView({")
          end = app.index("function StacksView({", start)
          app = app[:start] + r'''function WorkspacesView({
  workspaces,
  form,
  setForm,
  workspaceRemovalName,
  onCreate,
  onUse,
  onEdit,
  onCancelEdit,
  onAskRemove,
  onCancelRemove,
  onRemove,
  onOpenStacks,
}: {
  workspaces?: WorkspaceListResult;
  form: WorkspaceFormState;
  setForm: React.Dispatch<React.SetStateAction<WorkspaceFormState>>;
  workspaceRemovalName?: string;
  onCreate: () => void;
  onUse: (name: string) => void;
  onEdit: (workspace: WorkspaceDefinition) => void;
  onCancelEdit: () => void;
  onAskRemove: (name: string) => void;
  onCancelRemove: () => void;
  onRemove: (name: string) => void;
  onOpenStacks: () => void;
}) {
  const entries = workspaces?.workspaces ?? [];
  const currentWorkspaceName = workspaces?.currentWorkspaceName;
  const editing = form.editingName !== undefined;

  return (
    <div className="view-stack">
      <section className="hero-panel compact-hero">
        <div>
          <p className="eyebrow">Workspace management</p>
          <h2>Configure source roots from the browser.</h2>
          <p className="muted">Create, edit, select and remove local workspaces without returning to the terminal.</p>
        </div>
        <button className="secondary" type="button" onClick={onOpenStacks}>Open stacks</button>
      </section>

      <section className="grid two-columns workspace-management-grid">
        <Panel title={editing ? `Edit ${form.editingName}` : 'Add workspace'} subtitle="Stored in the local user config">
          <div className="workspace-form">
            <div className="workspace-form-header">
              <StatusPill tone={editing ? 'warning' : 'ok'}>{editing ? 'Editing existing workspace' : 'New workspace'}</StatusPill>
              <small>{editing ? 'Update the source path, then save.' : 'Choose a short name and a local source root.'}</small>
            </div>
            <label>
              Name
              <input
                placeholder="dev"
                value={form.name}
                disabled={form.busy || editing}
                onChange={(event) => setForm((current) => ({ ...current, name: event.target.value, error: undefined, message: undefined }))}
              />
            </label>
            <label>
              Path
              <input
                placeholder="C:\\Sources or /home/me/sources"
                value={form.path}
                disabled={form.busy}
                onChange={(event) => setForm((current) => ({ ...current, path: event.target.value, error: undefined, message: undefined }))}
              />
            </label>
            <p className="workspace-form-hint">Saving an existing workspace name updates its path. Use remove only when you no longer need that source root.</p>
            <div className="actions workspace-form-actions">
              <button type="button" onClick={onCreate} disabled={form.busy}>{form.busy ? 'Saving...' : editing ? 'Update workspace' : 'Create workspace'}</button>
              {editing ? <button className="secondary" type="button" onClick={onCancelEdit} disabled={form.busy}>Cancel edit</button> : null}
            </div>
            {form.error === undefined ? null : <Banner tone="danger">{form.error}</Banner>}
            {form.message === undefined ? null : <Banner tone="info">{form.message}</Banner>}
          </div>
        </Panel>

        <Panel title="Saved workspaces" subtitle={currentWorkspaceName === undefined ? 'No current workspace' : `Current: ${currentWorkspaceName}`}>
          <div className="workspace-list polished-workspace-list">
            {entries.length === 0 ? (
              <EmptyState title="No workspace saved yet" detail="Create a workspace to make scan and stack operations start from a known root." />
            ) : (
              entries.map((workspace) => (
                <WorkspaceCard
                  key={workspace.name}
                  workspace={workspace}
                  current={workspace.name === currentWorkspaceName}
                  busy={form.busy}
                  removalRequested={workspaceRemovalName === workspace.name}
                  onUse={() => onUse(workspace.name)}
                  onEdit={() => onEdit(workspace)}
                  onAskRemove={() => onAskRemove(workspace.name)}
                  onCancelRemove={onCancelRemove}
                  onRemove={() => onRemove(workspace.name)}
                />
              ))
            )}
          </div>
        </Panel>
      </section>
    </div>
  );
}

function WorkspaceCard({
  workspace,
  current,
  busy,
  removalRequested,
  onUse,
  onEdit,
  onAskRemove,
  onCancelRemove,
  onRemove,
}: {
  workspace: WorkspaceDefinition;
  current: boolean;
  busy: boolean;
  removalRequested: boolean;
  onUse: () => void;
  onEdit: () => void;
  onAskRemove: () => void;
  onCancelRemove: () => void;
  onRemove: () => void;
}) {
  return (
    <article className={current ? 'workspace-card current polished-workspace-card' : 'workspace-card polished-workspace-card'}>
      <div className="workspace-card-main">
        <div className="workspace-card-header">
          <div className="workspace-title-row">
            <strong>{workspace.name}</strong>
            {current ? <StatusPill tone="ok">Current</StatusPill> : <StatusPill tone="warning">Saved</StatusPill>}
          </div>
          <PathDisplay path={workspace.path} />
        </div>
      </div>
      <div className="workspace-card-actions">
        {current ? <span className="current-label">Active workspace</span> : <button className="secondary" type="button" onClick={onUse} disabled={busy}>Use</button>}
        <button className="secondary" type="button" onClick={onEdit} disabled={busy}>Edit</button>
        {removalRequested ? (
          <div className="workspace-remove-confirmation">
            <span>Remove this workspace?</span>
            <button className="danger compact-button" type="button" onClick={onRemove} disabled={busy}>Confirm</button>
            <button className="ghost compact-button" type="button" onClick={onCancelRemove} disabled={busy}>Cancel</button>
          </div>
        ) : (
          <button className="ghost danger-link" type="button" onClick={onAskRemove} disabled={busy}>Remove</button>
        )}
      </div>
    </article>
  );
}

function PathDisplay({ path }: { path: string }) {
  return <code className="path-code" title={path}>{path}</code>;
}

''' + app[end:]

          app_path.write_text(app)

          css_path = Path('src/ui/styles.css')
          css = css_path.read_text()
          css_append = r'''

.workspace-management-grid {
  grid-template-columns: minmax(18rem, .78fr) minmax(0, 1.22fr);
  align-items: start;
}

.workspace-form,
.workspace-form-header,
.polished-workspace-list {
  display: grid;
  gap: .85rem;
}

.workspace-form-header {
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
}

.workspace-form-hint {
  margin: 0;
  color: #94a3b8;
  font-size: .86rem;
  line-height: 1.45;
}

.workspace-form-actions {
  margin: .15rem 0 0;
}

.polished-workspace-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 1rem;
  padding: 1rem;
  border: 1px solid rgba(148, 163, 184, .2);
  border-radius: 1.1rem;
  background: linear-gradient(145deg, rgba(15, 23, 42, .82), rgba(30, 41, 59, .48));
}

.polished-workspace-card.current {
  border-color: rgba(34, 197, 94, .42);
  background: linear-gradient(145deg, rgba(20, 83, 45, .24), rgba(15, 23, 42, .82));
}

.workspace-card-header,
.workspace-title-row,
.workspace-card-actions {
  display: flex;
  align-items: center;
  gap: .7rem;
}

.workspace-card-main {
  min-width: 0;
}

.workspace-card-header {
  display: grid;
  justify-items: start;
}

.workspace-title-row {
  flex-wrap: wrap;
}

.path-code {
  display: block;
  width: 100%;
  max-width: 100%;
  overflow: hidden;
  border: 1px solid rgba(148, 163, 184, .16);
  border-radius: .7rem;
  padding: .5rem .65rem;
  background: rgba(2, 6, 23, .42);
  color: #bfdbfe;
  font-size: .86rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.current-label {
  color: #86efac;
  font-size: .84rem;
  font-weight: 800;
  white-space: nowrap;
}

button.ghost {
  background: transparent;
  border-color: rgba(148, 163, 184, .24);
  box-shadow: none;
}

button.danger-link {
  color: #fecaca;
}

button.compact-button {
  padding: .52rem .7rem;
  border-radius: .7rem;
  font-size: .84rem;
}

.workspace-remove-confirmation {
  display: flex;
  align-items: center;
  gap: .55rem;
  border: 1px solid rgba(248, 113, 113, .3);
  border-radius: .85rem;
  padding: .35rem;
  background: rgba(127, 29, 29, .18);
}

.workspace-remove-confirmation span {
  color: #fecaca;
  font-size: .84rem;
  font-weight: 800;
  white-space: nowrap;
}

@media (max-width: 900px) {
  .workspace-management-grid,
  .polished-workspace-card {
    grid-template-columns: 1fr;
  }

  .workspace-card-actions,
  .workspace-remove-confirmation {
    flex-wrap: wrap;
    justify-content: flex-start;
  }
}
'''
          if '.polished-workspace-card' not in css:
            css = css + css_append
          css_path.write_text(css)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          changelog = changelog.replace(
            "- Local UI workspace management: create saved workspaces, select the current workspace and remove saved workspaces from `compose ui`.\n",
            "- Local UI workspace management: create saved workspaces, update an existing workspace path, select the current workspace and remove saved workspaces from `compose ui`.\n",
          )
          if '- Workspace management UI polished with compact forms, readable path chips, edit mode, less aggressive destructive actions and explicit remove confirmation.\n' not in changelog:
            changelog = changelog.replace(
              '### Changed\n\n- The local UI now treats workspace configuration as a first-class browser workflow instead of a read-only status panel.\n',
              '### Changed\n\n- The local UI now treats workspace configuration as a first-class browser workflow instead of a read-only status panel.\n- Workspace management UI polished with compact forms, readable path chips, edit mode, less aggressive destructive actions and explicit remove confirmation.\n',
            )
          changelog_path.write_text(changelog)

          docs_path = Path('docs/local-ui-server.md')
          docs = docs_path.read_text()
          docs = docs.replace(
            '- Workspace management with create, select-current and remove actions.\n',
            '- Workspace management with create, edit-path, select-current and confirmed remove actions.\n',
          )
          docs = docs.replace(
            'The local UI can manage saved workspaces from the browser. The same local token protection applies to read and write endpoints.\n',
            'The local UI can manage saved workspaces from the browser. The same local token protection applies to read and write endpoints. The workspace panel keeps destructive remove actions behind an explicit confirmation and uses the same save endpoint to update an existing workspace path.\n',
          )
          docs_path.write_text(docs)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/ui/App.tsx src/ui/styles.css CHANGELOG.md docs/local-ui-server.md
          git commit -m "fix: polish workspace management UI"
          git push
