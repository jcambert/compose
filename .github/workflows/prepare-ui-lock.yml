name: Prepare UI Lockfile

on:
  push:
    branches:
      - build/bundle-local-gui-assets

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: build/bundle-local-gui-assets
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock update
        run: |
          if git diff --quiet package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync lockfile for bundled UI"
          git push origin build/bundle-local-gui-assets
