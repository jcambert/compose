name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish package to npm after validation'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  validate-package:
    name: Validate release package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke CLI
        run: npm run smoke

      - name: Package dry-run
        run: npm run pack:dry-run

      - name: Publish to npm
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
        run: npm publish --access public
