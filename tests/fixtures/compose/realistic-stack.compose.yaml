name: compose-realistic
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - backend
  labels:
    com.example.managed: "true"
services:
  api:
    <<: *service-defaults
    image: node:22-alpine
    command: ["node", "server.js"]
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://app:secret@db:5432/app
    volumes:
      - ./src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    secrets:
      - api_token
    configs:
      - source: app_config
        target: /app/config.json
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10
networks:
  backend:
    driver: bridge
volumes:
  database: {}
secrets:
  api_token:
    file: ./secrets/api-token.txt
configs:
  app_config:
    file: ./config/app.json
